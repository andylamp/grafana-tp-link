global:
  scrape_interval: 30s
  scrape_timeout: 25s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pyprom-exporters
    metrics_path: /metrics
    static_configs:
      - targets: ["exporter:8090"]

  - job_name: prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:9090"]
