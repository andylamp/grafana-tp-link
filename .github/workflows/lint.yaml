name: Code quality and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, formatting and type checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run lint, formatting, type and security checks
        run: uv run --locked prek run --all-files

  test:
    name: Tests and package build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run unit and contract tests in parallel
        run: uv run --locked pytest -m 'not integration'
      - name: Build wheel and source distribution
        run: uv build --no-sources

  integration:
    name: Docker stack integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test provisioned stack with simulated device metrics
        run: uv run --locked pytest -n 0 -m integration
        env:
          RUN_STACK_INTEGRATION: "1"
